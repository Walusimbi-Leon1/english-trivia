name: Generate English Phrase Data

# Fills the remaining phrase data files (colloquialisms, jargon, euphemisms,
# maxims & aphorisms, clichés) using opencode.ai (big-pickle) from GitHub
# runners — fresh IPs, no rate-limit history. Idioms + proverbs were curated
# manually and are already committed; this keeps the rest of the corpus in
# the repo, from which the question pipeline sources its trivia.

on:
  workflow_dispatch:
    inputs:
      categories:
        description: "Comma-separated categories to (re)generate (default: all missing/short)"
        required: false
        default: ""
  schedule:
    # Daily top-up: fills any category that is short of its target.
    - cron: "23 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-phrases
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate phrase data
        run: node scripts/generate-phrases.js
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: big-pickle
          ONLY: ${{ inputs.categories }}

      - name: Commit generated data (via PR — main is protected)
        run: |
          set -euo pipefail
          if git diff --quiet -- data/; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "english-trivia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="data/phrases-$(date +%s)"
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "Generate phrase data via GitHub Actions (opencode.ai big-pickle)" -m "Categories: $(git diff --name-only HEAD~1 2>/dev/null | grep '^data/' | sed 's|data/||;s|\.json||' | tr '\n' ', ' || true)"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Generated phrase data (GitHub Actions)" --body "Automated phrase corpus update from the generate-phrases workflow." --repo "$GITHUB_REPOSITORY")
          echo "PR: $PR_URL"
          # Branch protection requires a PR (0 approvals) — squash-merge it.
          gh pr merge "$PR_URL" --squash --delete-branch
          echo "Merged: $PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
